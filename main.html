<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
        }
        table {
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
        .nested-table {
            width: 100%;
            border-collapse: collapse;
        }
        .black-cell {
            background-color: black;
            color: white;
            font-weight: bold;
        }
        .link-text {
            color: purple;
            text-decoration: underline;
        }
        .list-container {
            text-align: left;
            padding-left: 20px;
        }
    </style>
  </head>
  <body>
    <table style="width: 800px; height: 500px;">
      <tr>
        <!-- Top-Left Cell with Nested Table 2 -->
        <td style="width: 50%; vertical-align: top;">
          <table class="nested-table">
            <tr>
              <th colspan="2">Nested Table 2</th>
            </tr>
            <tr>
              <th style="width: 50%;">Column 1</th>
              <th style="width: 50%;">Column 2</th>
            </tr>
            <tr>
              <td>abc</td>
              <td>def</td>
            </tr>
          </table>
        </td>

        <!-- Top-Right Cell with Nested Table 1 -->
        <td style="width: 50%; vertical-align: top;">
          <table class="nested-table">
            <tr>
              <th>Nested Table 1</th>
            </tr>
            <tr>
              <td class="list-container">
                <ul style="margin: 0; padding-left: 20px;">
                  <li>List item 1</li>
                  <li>List item 2</li>
                  <li>List item 3</li>
                </ul>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <!-- Bottom-Left Cell with Nested Table 3 -->
        <td style="width: 50%; vertical-align: top;">
          <table class="nested-table">
            <tr>
              <th colspan="2">Nested Table 3</th>
            </tr>
            <tr>
              <td style="width: 50%;">
                <a href="#" class="link-text">Nested Table</a>
              </td>
              <td style="width: 50%;">Demo Continued</td>
            </tr>
          </table>
        </td>

        <!-- Bottom-Right Cell with Nested Table 4 -->
        <td style="width: 50%; vertical-align: top;">
          <table class="nested-table">
            <tr>
              <th>Nested Table 4</th>
            </tr>
            <tr>
              <td class="black-cell" style="padding: 20px;">HTML</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
